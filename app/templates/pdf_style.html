{#- Foglio di stile comune ai documenti stampabili (WeasyPrint/xhtml2pdf).
    Inline di proposito: i renderer PDF non risolvono fogli esterni quando
    l'HTML viene passato come stringa. -#}
<style type="text/css">
  body.asl-pdf { background: #ffffff; color: #111111; font-family: "Helvetica", "Arial", sans-serif; font-size: 11.5px; }
  .pdf-page { width: 100%; padding: 0; }
  .pdf-header { border-bottom: 3px solid #0b5f8a; padding-bottom: 8px; margin-bottom: 14px; }
  .pdf-header .pdf-org { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #0b5f8a; font-weight: bold; }
  .pdf-header h1 { font-size: 17px; margin: 4px 0 2px; color: #073f5c; }
  .pdf-header .pdf-meta { font-size: 10px; color: #555555; }
  .pdf-patient-box { background: #f6fafd; border: 1px solid #cfd9e3; padding: 8px 10px; margin-bottom: 14px; }
  .pdf-patient-box b { color: #073f5c; }
  .pdf-section-title { margin: 16px 0 8px; padding: 5px 8px; font-size: 13px; font-weight: bold; background: #e8f2f8; border-left: 4px solid #0b5f8a; color: #073f5c; }
  table.pdf-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  table.pdf-table th { background: #0b5f8a; color: #ffffff; font-size: 10.5px; text-transform: uppercase; text-align: left; padding: 6px 8px; border: 1px solid #0b5f8a; }
  table.pdf-table td { padding: 6px 8px; border: 1px solid #cfd9e3; }
  table.pdf-table tr.alt td { background: #f6fafd; }
  .pdf-field { margin: 0 0 9px; }
  .pdf-field .pdf-field-label { font-weight: bold; color: #073f5c; }
  .pdf-field .pdf-field-value { color: #222222; }
  .pdf-footer { margin-top: 20px; border-top: 1px solid #cfd9e3; padding-top: 6px; font-size: 9.5px; color: #6b7a90; text-align: center; }
  /* Le domande dei questionari arrivano da markup storico: uniformiamo qui. */
  h4 { margin: 14px 0 6px; font-size: 12.5px; color: #073f5c; }
  center h4 { background: #e8f2f8; border-left: 4px solid #0b5f8a; padding: 5px 8px; text-align: left; }
  center { display: block; text-align: center; }
  i { color: #111111; }
</style>
